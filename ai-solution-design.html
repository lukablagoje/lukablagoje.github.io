<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>AI Solution Design</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Design an AI app concept by selecting Problem, Data, Intelligence, and UI." />
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at top, #142335 0%, #0b0f14 50%, #090d12 100%);
      color: #e7eef7;
      min-height: 100vh;
    }

    main {
      width: min(1150px, 95vw);
      margin: 0 auto;
      padding: 36px 0 56px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.7rem, 2.2vw, 2.4rem);
    }

    .muted {
      color: #afc1d4;
      margin-bottom: 26px;
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, 1fr) minmax(330px, 1fr);
      gap: 24px;
      align-items: start;
    }

    .panel {
      border: 1px solid #2a3f56;
      border-radius: 14px;
      background: rgba(10, 16, 24, 0.85);
      backdrop-filter: blur(2px);
      padding: 20px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.25);
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 16px;
    }

    label {
      font-weight: 650;
      color: #d8e4f3;
    }

    select {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #35506a;
      padding: 10px 12px;
      background: #0f1a26;
      color: #e7eef7;
      font-size: 0.98rem;
    }

    .helper {
      margin: 12px 0 0;
      color: #96a9bc;
      font-size: 0.92rem;
    }

    .app-window {
      border: 1px solid #3a516a;
      border-radius: 12px;
      overflow: hidden;
      background: #121b26;
      min-height: 370px;
    }

    .window-top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid #304457;
      background: #0b1621;
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      display: inline-block;
    }

    .dot.red { background: #fb7185; }
    .dot.yellow { background: #f59e0b; }
    .dot.green { background: #34d399; }

    .window-body {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid #35506a;
      background: #102233;
      color: #b7d0e7;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 0.78rem;
    }

    .preview-box {
      border: 1px solid #35506a;
      border-radius: 10px;
      background: linear-gradient(180deg, #172a3b 0%, #101924 100%);
      padding: 12px;
    }

    .preview-title {
      margin: 0 0 6px;
      font-size: 1rem;
    }

    .preview-desc {
      margin: 0;
      color: #b8ccdf;
      font-size: 0.92rem;
    }

    ul {
      margin: 0;
      padding-left: 20px;
      color: #c7d8ea;
    }

    a {
      color: #7dd3fc;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>AI Solution Design</h1>
    <p class="muted">
      Select <strong>Problem</strong>, <strong>Data</strong>, <strong>Intelligence</strong>, and <strong>UI</strong> to generate a suggested app, website, or platform concept.
    </p>

    <div class="layout">
      <section class="panel" aria-label="Design Controls">
        <div class="field">
          <label for="problem">1) Problem</label>
          <select id="problem">
            <option value="customer-support">Customer Support Automation</option>
            <option value="fraud">Fraud Detection</option>
            <option value="sales-forecast">Sales Forecasting</option>
            <option value="document">Document Intelligence</option>
          </select>
        </div>

        <div class="field">
          <label for="data">2) Data</label>
          <select id="data">
            <option value="structured">Structured Tables / SQL</option>
            <option value="mixed">Mixed (Text + Structured)</option>
            <option value="stream">Real-Time Event Stream</option>
            <option value="docs">PDFs, Emails, and Docs</option>
          </select>
        </div>

        <div class="field">
          <label for="intelligence">3) Intelligence</label>
          <select id="intelligence">
            <option value="llm">LLM + RAG Assistant</option>
            <option value="predictive">Predictive ML Models</option>
            <option value="rules">Rules + Anomaly Engine</option>
            <option value="agentic">Agentic Workflow</option>
          </select>
        </div>

        <div class="field">
          <label for="ui">4) UI</label>
          <select id="ui">
            <option value="web-app">Internal Web App</option>
            <option value="customer-portal">Customer Website</option>
            <option value="mobile">Mobile Companion</option>
            <option value="platform">Analytics Platform</option>
          </select>
        </div>

        <p class="helper">
          The preview updates automatically as soon as you change any dropdown.
        </p>
      </section>

      <section class="panel" aria-label="Preview Window">
        <div class="app-window" role="status" aria-live="polite">
          <div class="window-top">
            <span class="dot red"></span>
            <span class="dot yellow"></span>
            <span class="dot green"></span>
            <strong id="windowLabel" style="margin-left:8px; font-size:0.9rem;">Generated Concept</strong>
          </div>
          <div class="window-body">
            <div class="chip-row" id="selectionSummary"></div>
            <div class="preview-box">
              <h2 class="preview-title" id="solutionName"></h2>
              <p class="preview-desc" id="solutionDesc"></p>
            </div>
            <div class="preview-box">
              <h2 class="preview-title">Core Capabilities</h2>
              <ul id="featureList"></ul>
            </div>
          </div>
        </div>
      </section>
    </div>

    <p class="muted" style="margin-top:22px;">
      <a href="index.html">← Back to Home</a>
    </p>
  </main>

  <script>
    const controls = {
      problem: document.getElementById('problem'),
      data: document.getElementById('data'),
      intelligence: document.getElementById('intelligence'),
      ui: document.getElementById('ui')
    };

    const selectionSummary = document.getElementById('selectionSummary');
    const solutionName = document.getElementById('solutionName');
    const solutionDesc = document.getElementById('solutionDesc');
    const featureList = document.getElementById('featureList');
    const windowLabel = document.getElementById('windowLabel');

    function titleize(value) {
      return value
        .replace(/-/g, ' ')
        .replace(/\b\w/g, (char) => char.toUpperCase());
    }

    function buildConcept(problem, data, intelligence, ui) {
      const solutionType = ui === 'platform' ? 'Platform' : (ui === 'customer-portal' ? 'Website' : 'App');
      const name = `${titleize(problem)} ${solutionType}`;

      const description = `A ${solutionType.toLowerCase()} focused on ${titleize(problem).toLowerCase()}, powered by ${titleize(intelligence).toLowerCase()} and built for ${titleize(ui).toLowerCase()} experiences using ${titleize(data).toLowerCase()} data.`;

      const features = [
        `Live ${titleize(problem)} dashboard with clear priority scoring`,
        `${titleize(data)} ingestion pipeline with governance checks`,
        `${titleize(intelligence)} decision engine with explainability panel`,
        `${titleize(ui)} interface with role-based actions and alerts`
      ];

      return { name, description, features, solutionType };
    }

    function render() {
      const selected = {
        problem: controls.problem.value,
        data: controls.data.value,
        intelligence: controls.intelligence.value,
        ui: controls.ui.value
      };

      selectionSummary.innerHTML = '';
      Object.entries(selected).forEach(([key, value]) => {
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.textContent = `${titleize(key)}: ${titleize(value)}`;
        selectionSummary.appendChild(chip);
      });

      const concept = buildConcept(selected.problem, selected.data, selected.intelligence, selected.ui);
      solutionName.textContent = concept.name;
      solutionDesc.textContent = concept.description;
      windowLabel.textContent = `${concept.solutionType} Preview`;

      featureList.innerHTML = '';
      concept.features.forEach((feature) => {
        const li = document.createElement('li');
        li.textContent = feature;
        featureList.appendChild(li);
      });
    }

    Object.values(controls).forEach((control) => control.addEventListener('change', render));
    render();
  </script>
</body>
</html>
